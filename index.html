<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Album Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header class="app-header">
    <div class="logo">
      <svg height="40" width="40" viewBox="0 0 24 24" fill="#1DB954">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.899 4.62-1.02 8.58-.6 11.7 1.32.36.18.48.66.241 1.019zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
      <h1>Album Finder</h1>
    </div>
  </header>

  <main class="container">
    <section class="search-section">
      <h2>Discover Discographies</h2>
      <p>Search for your favorite artist to explore all of their albums on Spotify.</p>
      
      <form id="search-form" class="search-box" onsubmit="return false;">
        <input 
          type="text" 
          id="artist-search" 
          placeholder="Type an artist name (e.g., Daft Punk, Taylor Swift)..." 
          autocomplete="off" 
          required
        >
        <button type="submit" id="search-btn">Search Albums</button>
      </form>
    </section>

    <div id="loading" class="status-message hidden">
      <div class="spinner"></div>
      <p>Fetching discography from Spotify...</p>
    </div>

    <!-- Artist Header (Populated dynamically) -->
    <div id="artist-header" class="artist-header hidden">
      <img id="artist-image" src="" alt="Artist portrait">
      <div class="artist-info">
        <h2 id="artist-name">Artist Name</h2>
        <p id="artist-meta"></p>
      </div>
    </div>

    <!-- Album Display  -->
    <section id="albums-grid" class="albums-grid">
      <!-- Album cards will be dynamically inserted here by JS -->
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
